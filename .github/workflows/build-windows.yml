name: Build Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build Electron for Windows
        run: npm run electron:build

      - name: Upload Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Farever-PRO-Installer
          path: dist/*.exe
          retention-days: 30

      - name: Upload Portable Version
        uses: actions/upload-artifact@v4
        with:
          name: Farever-PRO-Portable
          path: dist/*-win*
          retention-days: 30
